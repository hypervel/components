packages:
  - 'src/*'
  - 'src/foundation/resources/exceptions/renderer'
  - 'dogfood/ai/workbench'

# Vite+ manages the runtime and package manager declared in package.json.
runtimeOnFail: ignore
pmOnFail: ignore

allowBuilds:
  '@parcel/watcher': true

# The core alias exposes the Vite+ version, so Vite-compatible plugins can
# report a peer version mismatch despite using the bundled Vite runtime.
# Update both core aliases with the vite-plus catalog pin; match Vitest to `vp toolchain vitest`.
overrides:
  'vite@*': npm:@voidzero-dev/vite-plus-core@1.4.0
  'vitest@*': 5.0.5

# Supply-chain defense: require packages to be at least 7 days old before
# install. Compromised packages typically get yanked within hours, so this
# buffer dramatically reduces the chance of pulling a malicious release.
# Value is in minutes (7 days × 24h × 60min = 10080).
minimumReleaseAge: 10080
catalog:
  '@popperjs/core': ^2.11.8
  '@tailwindcss/vite': ^4.3.3
  '@types/node': ^22.20.5
  '@vitejs/plugin-vue': ^6.0.10
  '@vue/compiler-dom': ^3.5.44
  '@vue/server-renderer': ^3.5.44
  '@vue/test-utils': ^2.5.1
  alpinejs: ^3.17.5
  axios: ^1.20.0
  bootstrap: ^5.3.8
  jsdom: ^30.1.3
  laravel-vite-plugin: ^3.2.0
  moment-timezone: ^0.5.48
  sass: ^1.106.0
  tailwindcss: ^4.3.3
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vue: ^3.5.44
  vue-json-pretty: ^2.6.0
  vue-router: ^5.4.0
