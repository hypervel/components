name: mercure

on:
  push:
    branches:
      - 0.4
  pull_request:

permissions:
  contents: read

jobs:
  mercure:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mercure:
        image: dunglas/mercure:v1.0.2
        env:
          SERVER_NAME: :80
          MERCURE_TRUSTED_ISSUERS: http://hypervel.test
          MERCURE_PUBLISHER_JWT_KEY: hypervel-mercure-integration-signing-key
          MERCURE_SUBSCRIBER_JWT_KEY: hypervel-mercure-integration-signing-key
          MERCURE_PUBLISHER_JWT_ALG: HS256
          MERCURE_SUBSCRIBER_JWT_ALG: HS256
          MERCURE_EXTRA_DIRECTIVES: |
            transport local
            cookie_name mercureAuthorization
            subscriptions
            publish_origins http://hypervel.test
        options: >-
          --health-cmd "wget -q --spider http://127.0.0.1:2019/mercure/health/ready"
          --health-interval 2s
          --health-start-period 2s
          --health-timeout 2s
          --health-retries 15

    container:
      image: ghcr.io/hypervel/components-ci:php${{ matrix.php }}-swoole6.2.2

    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]

    name: Mercure Integration Tests (PHP ${{ matrix.php }})

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log trigger context
        uses: ./.github/actions/log-trigger-context

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: COMPOSER_MEMORY_LIMIT=-1 composer install --prefer-dist -n -o

      - name: Execute broadcasting integration tests
        env:
          MERCURE_URL: http://mercure/.well-known/mercure
          MERCURE_JWT_SECRET: hypervel-mercure-integration-signing-key
          MERCURE_JWT_ISSUER: http://hypervel.test
          MERCURE_COOKIE_NAME: mercureAuthorization
        run: vendor/bin/paratest tests/Integration/Broadcasting
