name: grpc

on:
  push:
  pull_request:

env:
  RUN_BLOCKING_TESTS: true

jobs:
  grpc:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    container:
      image: phpswoole/swoole:6.2.0-php8.4

    strategy:
      fail-fast: true

    name: gRPC Integration Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log trigger context
        uses: ./.github/actions/log-trigger-context

      - name: Setup PHP extensions
        uses: ./.github/actions/setup-php

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tests/Integration/Grpc/Interop/go.mod
          cache-dependency-path: tests/Integration/Grpc/Interop/go.sum

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: /root/.composer/cache
          key: composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: COMPOSER_MEMORY_LIMIT=-1 composer install --prefer-dist -n -o

      - name: Start gRPC test servers
        run: |
          rm -f /tmp/test-servers-ready
          bin/test-servers.sh grpc &
          while [ ! -f /tmp/test-servers-ready ]; do sleep 1; done

      - name: Execute PHP integration tests
        env:
          TEST_SERVER_HOST: 127.0.0.1
        run: vendor/bin/paratest tests/Integration/Grpc

      - name: Execute grpc-go client against Hypervel
        run: .tmp/grpc-interop/client

      - name: Execute grpc-go client against Hypervel TLS
        env:
          GRPC_GO_CLIENT_TARGET: 127.0.0.1:19522
          GRPC_GO_CLIENT_CA: tests/Integration/Grpc/Fixtures/Tls/ca.crt
          GRPC_GO_CLIENT_SERVER_NAME: localhost
        run: .tmp/grpc-interop/client
