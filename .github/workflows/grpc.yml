name: grpc

on:
  push:
    branches:
      - 0.4
  pull_request:

permissions:
  contents: read

env:
  RUN_BLOCKING_TESTS: true

jobs:
  grpc:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    container:
      image: ghcr.io/hypervel/components-ci:php${{ matrix.php }}-swoole6.2.2

    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]

    name: gRPC Integration Tests (PHP ${{ matrix.php }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Log trigger context
        uses: ./.github/actions/log-trigger-context

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: tests/Integration/Grpc/Interop/go.mod
          cache-dependency-path: tests/Integration/Grpc/Interop/go.sum

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: /root/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: COMPOSER_MEMORY_LIMIT=-1 composer install --prefer-dist -n -o

      - name: Start gRPC test servers
        uses: ./.github/actions/start-test-servers
        with:
          group: grpc

      - name: Execute PHP integration tests
        env:
          TEST_SERVER_HOST: 127.0.0.1
        run: vendor/bin/paratest tests/Integration/Grpc

      - name: Execute grpc-go client against Hypervel
        run: .tmp/grpc-interop/client

      - name: Execute grpc-go client against Hypervel TLS
        env:
          GRPC_GO_CLIENT_TARGET: 127.0.0.1:19522
          GRPC_GO_CLIENT_CA: tests/Integration/Grpc/Fixtures/Tls/ca.crt
          GRPC_GO_CLIENT_SERVER_NAME: localhost
        run: .tmp/grpc-interop/client
