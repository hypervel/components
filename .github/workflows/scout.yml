name: scout

on:
  push:
    branches:
      - 0.4
  pull_request:

permissions:
  contents: read

env:
  RUN_BLOCKING_TESTS: true

jobs:
  meilisearch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      meilisearch:
        image: getmeili/meilisearch:latest
        env:
          MEILI_MASTER_KEY: secret
          MEILI_NO_ANALYTICS: true
        ports:
          - 7700:7700
        options: >-
          --health-cmd "curl -f http://localhost:7700/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    container:
      image: ghcr.io/hypervel/components-ci:php${{ matrix.php }}-swoole6.2.2

    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]

    name: Meilisearch (PHP ${{ matrix.php }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Log trigger context
        uses: ./.github/actions/log-trigger-context

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: /root/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: COMPOSER_MEMORY_LIMIT=-1 composer install --prefer-dist -n -o

      - name: Execute integration tests
        env:
          RUN_MEILISEARCH_INTEGRATION_TESTS: true
          MEILISEARCH_HOST: meilisearch
          MEILISEARCH_PORT: 7700
          MEILISEARCH_KEY: secret
        run: vendor/bin/paratest tests/Integration/Scout/Meilisearch

  typesense:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      typesense:
        image: typesense/typesense:27.1
        env:
          TYPESENSE_API_KEY: secret
          TYPESENSE_DATA_DIR: /tmp
        ports:
          - 8108:8108

    container:
      image: ghcr.io/hypervel/components-ci:php${{ matrix.php }}-swoole6.2.2

    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]

    name: Typesense (PHP ${{ matrix.php }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Log trigger context
        uses: ./.github/actions/log-trigger-context

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: /root/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: COMPOSER_MEMORY_LIMIT=-1 composer install --prefer-dist -n -o

      - name: Execute integration tests
        env:
          RUN_TYPESENSE_INTEGRATION_TESTS: true
          TYPESENSE_HOST: typesense
          TYPESENSE_PORT: 8108
          TYPESENSE_API_KEY: secret
          TYPESENSE_PROTOCOL: http
        run: vendor/bin/paratest tests/Integration/Scout/Typesense

  algolia:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    container:
      image: ghcr.io/hypervel/components-ci:php${{ matrix.php }}-swoole6.2.2

    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]

    name: Algolia (PHP ${{ matrix.php }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Log trigger context
        uses: ./.github/actions/log-trigger-context

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: /root/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: COMPOSER_MEMORY_LIMIT=-1 composer install --prefer-dist -n -o

      - name: Check credentials available
        id: creds
        run: |
          if [ -n "${{ secrets.ALGOLIA_APP_ID }}" ] && [ -n "${{ secrets.ALGOLIA_SECRET }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute integration tests
        if: steps.creds.outputs.present == 'true'
        env:
          RUN_ALGOLIA_INTEGRATION_TESTS: true
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SECRET: ${{ secrets.ALGOLIA_SECRET }}
        run: vendor/bin/paratest tests/Integration/Scout/Algolia

      - name: Skip note (credentials not configured)
        if: steps.creds.outputs.present != 'true'
        run: echo "ALGOLIA_APP_ID / ALGOLIA_SECRET not configured — integration tests skipped."
