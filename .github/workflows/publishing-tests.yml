name: publishing tests

on:
  push:
    paths:
      - 'bin/split.sh'
      - 'bin/release.sh'
      - 'bin/splitsh-lite'
      - '.github/scripts/release.test.py'
      - '.github/workflows/publishing-tests.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/split.yml'
  pull_request:
    paths:
      - 'bin/split.sh'
      - 'bin/release.sh'
      - 'bin/splitsh-lite'
      - '.github/scripts/release.test.py'
      - '.github/workflows/publishing-tests.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/split.yml'

permissions:
  contents: read

jobs:
  publishing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell syntax
        run: |
          bash -n bin/split.sh
          bash -n bin/release.sh
      - name: Test publishing with local repositories
        run: python3 .github/scripts/release.test.py
