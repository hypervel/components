name: tests

on:
  push:
    branches:
      - 0.4
  pull_request:

permissions:
  contents: read

env:
  RUN_BLOCKING_TESTS: true

jobs:
  linux_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"

    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]

    name: PHP ${{ matrix.php }} (Swoole 6.3.0 RC1)

    container:
      image: ghcr.io/hypervel/components-ci:php${{ matrix.php }}-swoole6.3.0-rc1

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log trigger context
        uses: ./.github/actions/log-trigger-context

      - name: Install dependencies
        run: |
            COMPOSER_MEMORY_LIMIT=-1 composer install --prefer-dist -n -o

      - name: Check code style
        run: PHP_CS_FIXER_IGNORE_ENV=1 vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Check skeleton configuration
        run: composer check:skeleton-config

      - name: Run framework test suite
        run: vendor/bin/paratest -c phpunit.xml.dist

      - name: Run Permission suite with the database cache store
        run: CACHE_STORE=database vendor/bin/paratest -c phpunit.xml.dist tests/Permission

      - name: Run Testbench package-mode suite
        run: php src/testbench/bin/testbench package:test --parallel tests/Testbench

      # Local equivalent: composer test:dogfood. Direct commands bypass Composer's process timeout in CI.
      - name: Install Testbench dogfood package dependencies
        working-directory: dogfood/testbench-package
        run: COMPOSER_MEMORY_LIMIT=-1 composer install --prefer-dist -n -o

      - name: Run Testbench dogfood package suite
        working-directory: dogfood/testbench-package
        env:
          OTEL_SDK_DISABLED: true
        run: vendor/bin/testbench package:test --parallel

      - name: Install AI demo dependencies
        working-directory: dogfood/ai
        run: COMPOSER_MEMORY_LIMIT=-1 composer install --prefer-dist -n -o

      - name: Run AI demo suite
        working-directory: dogfood/ai
        run: vendor/bin/testbench package:test --no-progress

  javascript_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"
    name: JavaScript

    container:
      image: ghcr.io/hypervel/components-ci:php8.4-swoole6.3.0-rc1

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Log trigger context
        uses: ./.github/actions/log-trigger-context

      - name: Install Composer dependencies
        run: COMPOSER_MEMORY_LIMIT=-1 composer install --prefer-dist -n -o

      - name: Setup Vite+ and install dependencies
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Check frontend source
        run: vp run check

      - name: Build frontend assets
        run: vp run build

      - name: Check committed frontend assets
        run: |
          asset_changes=$(git status --porcelain --untracked-files=all -- \
            src/horizon/dist src/telescope/dist \
            src/foundation/resources/exceptions/renderer/dist \
            src/workbench/public/build src/mcp/resources/js/mcp-sdk.min.js)
          if [ -n "$asset_changes" ]; then
            printf '%s\n' "$asset_changes"
            echo 'Compiled assets are out of date. Run pnpm build from the repository root.'
            echo 'See the Compiled Assets section in src/docs/contributions.md. A maintainer must commit rebuilt assets before merging.'
            exit 1
          fi

      - name: Run JavaScript tests
        run: vp test

      - name: Run Wayfinder tests against cached routes
        run: vp run test:wayfinder:cached

      - name: Type-check generated Wayfinder output
        run: vp run typecheck:wayfinder
