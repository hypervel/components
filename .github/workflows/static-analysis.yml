name: static analysis

on:
  push:
    branches:
      - 0.4
  pull_request:

permissions:
  contents: read

jobs:
  actions_lockfile:
    name: Verify Actions Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Log trigger context
        uses: ./.github/actions/log-trigger-context

      - name: Verify Actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Source Code
            config: phpstan.neon.dist
          - name: Types
            config: phpstan.types.neon.dist
          - name: Test Rules
            config: phpstan.tests.neon.dist

    name: ${{ matrix.name }}

    container:
      image: ghcr.io/hypervel/components-ci:php8.4-swoole6.3.0-rc1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Log trigger context
        uses: ./.github/actions/log-trigger-context

      - name: Install dependencies
        run: COMPOSER_MEMORY_LIMIT=-1 composer install --prefer-dist --no-interaction --no-progress

      - name: Execute type checking
        run: vendor/bin/phpstan --configuration="${{ matrix.config }}" --memory-limit=-1 --no-progress
