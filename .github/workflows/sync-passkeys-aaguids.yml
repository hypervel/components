name: synchronize Passkeys AAGUIDs

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  synchronize:
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/hypervel/components-ci:php8.4-swoole6.2.2

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Synchronize Passkeys AAGUIDs
        run: php src/passkeys/scripts/sync-aaguids.php

      - name: Open update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: sync-passkeys-aaguids
          delete-branch: true
          commit-message: "passkeys: synchronize AAGUID catalogue"
          title: "passkeys: synchronize AAGUID catalogue"
          body: "Automated synchronization from [passkey-authenticator-aaguids](https://github.com/passkeydeveloper/passkey-authenticator-aaguids)."
