name: databases-nightly

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql_innovation:
    if: github.repository == 'hypervel/components'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mysql:
        image: mysql:innovation
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-start-period 30s
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    container:
      image: ghcr.io/hypervel/components-ci:php8.4-swoole6.2.2

    name: MySQL Innovation

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log trigger context
        uses: ./.github/actions/log-trigger-context

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/.composer/cache
          key: composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: COMPOSER_MEMORY_LIMIT=-1 composer install --prefer-dist -n -o

      - name: Execute integration tests
        env:
          DB_HOST: mysql
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password
        run: bin/run-database-tests.sh mysql

  mariadb:
    if: github.repository == 'hypervel/components'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mariadb:
        image: quay.io/mariadb-foundation/mariadb-devel:verylatest
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: testing
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    container:
      image: ghcr.io/hypervel/components-ci:php8.4-swoole6.2.2

    name: MariaDB Very Latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log trigger context
        uses: ./.github/actions/log-trigger-context

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/.composer/cache
          key: composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: COMPOSER_MEMORY_LIMIT=-1 composer install --prefer-dist -n -o

      - name: Execute integration tests
        env:
          DB_HOST: mariadb
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password
        run: bin/run-database-tests.sh mariadb
