name: Deploy Doctum Docs

on:
  push:
    branches:
      - 0.4

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    container:
      image: ghcr.io/hypervel/components-ci:php8.4-swoole6.3.0-rc1

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify checkout
        run: git rev-parse --is-inside-work-tree

      - name: Install dependencies
        run: COMPOSER_MEMORY_LIMIT=-1 composer install --prefer-dist -n -o

      - name: Reset tracked files
        run: |
          git status --porcelain --untracked-files=no
          git reset --hard

      - name: Generate API docs
        run: |
          cp bin/doctum /tmp/doctum
          php -d memory_limit=-1 /tmp/doctum update doctum.php --force

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.10.1 --activate
          pnpm --version

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGE_PROJECT_NAME }}
        run: pnpm dlx wrangler@4 pages deploy doctum/build --project-name="$CLOUDFLARE_PAGE_PROJECT_NAME"
