name: Deploy Doctum Docs

on:
  push:
    branches:
      - 0.4

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    container:
      image: ghcr.io/hypervel/components-ci:php8.4-swoole6.2.2

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify checkout
        run: git rev-parse --is-inside-work-tree

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/.composer/cache
          key: composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: COMPOSER_MEMORY_LIMIT=-1 composer install --prefer-dist -n -o

      - name: Reset tracked files
        run: |
          git status --porcelain --untracked-files=no
          git reset --hard

      - name: Generate API docs
        run: |
          cp bin/doctum /tmp/doctum
          php -d memory_limit=-1 /tmp/doctum update doctum.php --force

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          pnpm config set ignore-workspace-root-check true
          pnpm --version

      - name: Deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy doctum/build --project-name=${{ secrets.CLOUDFLARE_PAGE_PROJECT_NAME }}
