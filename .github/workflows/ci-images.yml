name: Build CI Images

on:
  push:
    branches:
      - 0.4
      - feature/image
    paths:
      - .github/docker/ci/Dockerfile
      - .github/workflows/ci-images.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-images-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        php: ["8.4", "8.5"]

    name: PHP ${{ matrix.php }} (Swoole 6.2.2)

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        env:
          IMAGE: ghcr.io/hypervel/components-ci:php${{ matrix.php }}-swoole6.2.2
        run: |
          docker build \
            --pull \
            --build-arg PHP_VERSION=${{ matrix.php }} \
            --build-arg SOURCE_REPOSITORY=${{ github.repository }} \
            --tag "$IMAGE" \
            --file .github/docker/ci/Dockerfile \
            .github/docker/ci

      - name: Publish image
        env:
          IMAGE: ghcr.io/hypervel/components-ci:php${{ matrix.php }}-swoole6.2.2
        run: docker push "$IMAGE"

  cleanup:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    name: Remove old images

    steps:
      - name: Remove old untagged images
        uses: actions/delete-package-versions@v5
        with:
          package-name: components-ci
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: "true"
