name: Build CI Images

on:
  push:
    branches:
      - 0.4
    paths:
      - .github/docker/ci/Dockerfile
      - .github/workflows/ci-images.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-images-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'hypervel/components'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        php: ["8.4", "8.5"]
        swoole:
          - tag: swoole6.3.0-rc2
            base_prefix: 6.3.0-rc2-
          - tag: swoole-nightly
            base_prefix: ""

    name: Build php${{ matrix.php }}-${{ matrix.swoole.tag }}
    env:
      IMAGE: ghcr.io/hypervel/components-ci:php${{ matrix.php }}-${{ matrix.swoole.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish a plain manifest: cleanup deletes untagged versions,
      # including the required children of an image index.
      - name: Build image
        env:
          SWOOLE_BASE_TAG: ${{ matrix.swoole.base_prefix }}php${{ matrix.php }}
        run: |
          docker build \
            --pull \
            --provenance=false \
            --build-arg PHP_VERSION=${{ matrix.php }} \
            --build-arg SWOOLE_BASE_TAG="$SWOOLE_BASE_TAG" \
            --tag "$IMAGE" \
            --file .github/docker/ci/Dockerfile \
            .github/docker/ci

      - name: Publish image
        run: docker push "$IMAGE"

  cleanup:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    name: Remove old images

    steps:
      - name: Remove old untagged images
        uses: actions/delete-package-versions@v5.0.0
        with:
          package-name: components-ci
          package-type: container
          min-versions-to-keep: 2
          delete-only-untagged-versions: "true"
