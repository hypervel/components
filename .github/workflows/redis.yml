name: redis

on:
  push:
    branches:
      - 0.4
  pull_request:

env:
  RUN_BLOCKING_TESTS: true

jobs:
  redis_8:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Any-mode coverage requires phpredis 6.3.0+ for HSETEX support.
    container:
      image: ghcr.io/hypervel/components-ci:php${{ matrix.php }}-swoole6.2.2

    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]

    name: Redis 8 (PHP ${{ matrix.php }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Log trigger context
        uses: ./.github/actions/log-trigger-context

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: /root/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: COMPOSER_MEMORY_LIMIT=-1 composer install --prefer-dist -n -o

      - name: Execute Redis integration tests
        env:
          REDIS_HOST: redis
          REDIS_PORT: 6379
          REDIS_DB: 0
          REDIS_TEST_SECONDARY_DB: 1
        # Cap ParaTest's auto-detected workers: database 1 is reserved via
        # REDIS_TEST_SECONDARY_DB, leaving 15 worker databases in the 0-15 range.
        run: |
          vendor/bin/paratest --max-processes=15 tests/Integration/Auth/Redis
          vendor/bin/paratest --max-processes=15 tests/Integration/Cache/Redis
          vendor/bin/paratest --max-processes=15 tests/Integration/Horizon
          vendor/bin/paratest --max-processes=15 tests/Integration/Http/Redis
          vendor/bin/paratest --max-processes=15 tests/Integration/Queue/Redis
          vendor/bin/paratest --max-processes=15 tests/Integration/RateLimiter/Redis
          vendor/bin/paratest --max-processes=15 tests/Integration/Redis
          vendor/bin/paratest --max-processes=15 tests/Integration/Session/Redis

  valkey_9:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      valkey:
        image: valkey/valkey:9
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Any-mode coverage requires phpredis 6.3.0+ for HSETEX support.
    container:
      image: ghcr.io/hypervel/components-ci:php${{ matrix.php }}-swoole6.2.2

    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]

    name: Valkey 9 (PHP ${{ matrix.php }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Log trigger context
        uses: ./.github/actions/log-trigger-context

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: /root/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: COMPOSER_MEMORY_LIMIT=-1 composer install --prefer-dist -n -o

      - name: Execute Redis integration tests
        env:
          REDIS_HOST: valkey
          REDIS_PORT: 6379
          REDIS_DB: 0
          REDIS_TEST_SECONDARY_DB: 1
        # Cap ParaTest's auto-detected workers: database 1 is reserved via
        # REDIS_TEST_SECONDARY_DB, leaving 15 worker databases in the 0-15 range.
        run: |
          vendor/bin/paratest --max-processes=15 tests/Integration/Auth/Redis
          vendor/bin/paratest --max-processes=15 tests/Integration/Cache/Redis
          vendor/bin/paratest --max-processes=15 tests/Integration/Horizon
          vendor/bin/paratest --max-processes=15 tests/Integration/Http/Redis
          vendor/bin/paratest --max-processes=15 tests/Integration/Queue/Redis
          vendor/bin/paratest --max-processes=15 tests/Integration/RateLimiter/Redis
          vendor/bin/paratest --max-processes=15 tests/Integration/Redis
          vendor/bin/paratest --max-processes=15 tests/Integration/Session/Redis
