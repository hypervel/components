labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        You must read the [contribution guide](https://github.com/hypervel/components/blob/0.4/src/docs/contributions.md) in full before submitting. Provide a clear title and enough context for someone else to answer. Incomplete or ineligible submissions will be closed without a detailed review.

        Use Q&A for support and questions about unclear upstream sync status. Use [Ideas](https://github.com/hypervel/components/discussions/categories/ideas) for new Hypervel-specific features, and issue forms for reproducible bugs or eligible missing upstream functionality. Report suspected security vulnerabilities privately to albert@hypervel.org.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have read the contribution guide in full and this question belongs in Q&A.
          required: true
        - label: I have searched the existing discussions and documentation to see if my question has already been answered.
          required: true
  - type: textarea
    id: question
    attributes:
      label: Question and context
      description: Explain what you are trying to achieve and the specific question you need answered. For upstream sync questions, link the package and its tracker entry if one exists.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant versions and code
      description: Include relevant Hypervel, PHP, Swoole, and service versions, code snippets, and error output. Remove secrets. For a conceptual question, explain why runtime details do not apply.
    validations:
      required: true
  - type: textarea
    id: investigation
    attributes:
      label: What you have tried and consulted
      description: Explain what you tried and what happened. Link the documentation or existing discussions you checked and explain what remains unclear.
    validations:
      required: true
