blank_issues_enabled: false
contact_links:
  - name: Contribution guide — read before submitting
    url: https://github.com/hypervel/components/blob/0.4/src/docs/contributions.md
    about: Please read the full guide and follow its eligibility, evidence, testing, and review requirements.
  - name: Hypervel-specific feature proposal
    url: https://github.com/hypervel/components/discussions/categories/ideas
    about: Propose the feature in a discussion and obtain explicit maintainer approval before opening a pull request.
  - name: Support or unclear upstream sync status
    url: https://github.com/hypervel/components/discussions/categories/q-a
    about: Ask for help here, including when an upstream package has no recorded checked_through commit.
  - name: Documentation correction
    url: https://github.com/hypervel/components/blob/0.4/src/docs/contributions.md#pull-request-requirements
    about: Submit a pull request to this repository for incorrect or missing guidance in src/docs.
  - name: Security vulnerability
    url: https://github.com/hypervel/components/blob/0.4/src/docs/contributions.md#security-vulnerabilities
    about: Report vulnerabilities privately to albert@hypervel.org. Do not open a public issue.
