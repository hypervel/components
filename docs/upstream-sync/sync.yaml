# Upstream Sync State
#
# GitHub repository slugs, in processing order. Separate documentation
# repositories have their own entries; same-repository docs share the code entry.
#
# branch           — upstream branch to follow
# checked_through  — full upstream commit SHA reviewed through, inclusive
# last_reviewed_pr — last PR examined; informational, not a checkpoint
# sync_date        — date (YYYY-MM-DD) the completed sync finished verification
# notes            — optional package-specific sync instructions, such as unusual
#                    source mappings or generated files. Omit unless needed; do not
#                    repeat README differences, code comments or general workflow rules.
#
# A null checked_through means no verified commit checkpoint is established.

