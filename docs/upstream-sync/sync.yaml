  sync_date: '2026-10-02'
  notes: horizon:listen maps to Hypervel\Watcher and Console\HorizonRestartStrategy; assess behavior changes in upstream's bin/file-watcher.cjs against them instead of copying the Node script. Metric clearing uses the Redis flushByPattern/SafeScan operations instead of an inline SCAN loop. Rebuild dist with npm 11.10 or newer after resource or frontend dependency changes.

