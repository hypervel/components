  checked_through: b8e15909d59bbcff3d63e74a7858c9350027b485
  last_reviewed_pr: 17
  sync_date: '2026-10-02'
  notes: SentinelServiceProvider is not ported because its only job is a scoped SentinelManager binding. Hypervel auto-singletons the unbound manager, so drivers registered with extend() during boot reach every coroutine; a coroutine-scoped manager would lose them.

